# SonarQube Cloud (gratis para repos públicos). Lo ejecuta el job "sonar" de CI cuando existe SONAR_TOKEN.
# Si importas el repo con otra organización, ajusta organization y projectKey.
sonar.organization=ericroco
sonar.projectKey=ericroco_apuestasdeportivas
sonar.projectName=Apuestas deportivas

sonar.sources=apps/api/src,apps/web/src,apps/reports/src,packages/shared/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,apps/web/e2e,apps/reports/tests
sonar.exclusions=apps/api/src/generated/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,apps/reports/tests/**

# El job "sonar" reescribe las rutas de lcov para que sean relativas a la raíz del repo.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.python.coverage.reportPaths=apps/reports/coverage.xml
sonar.python.version=3.12

# Compuerta bloqueante (constitución: el quality gate debe aprobar para integrar).
sonar.qualitygate.wait=true
