[project]
name = "reports"
version = "0.1.0"
description = "Servicio de reportes (FastAPI): lee PostgreSQL con un usuario de solo lectura"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.163,<0.164",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic-settings>=2.16,<3",
  "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
# N818: las excepciones siguen la convención en español del proyecto (ErrorConfiguracion).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reports --cov-report=term-missing:skip-covered --cov-report=xml"
markers = ["integracion: requiere PostgreSQL real (docker compose arriba)"]

[tool.coverage.run]
omit = ["*/__main__.py"]
