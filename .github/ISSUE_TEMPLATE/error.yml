name: Error
description: Algo no funciona como dice el spec
title: '[Error] '
labels: ['error']
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. docker compose up -d && pnpm dev
        2. Abrir http://localhost:3000/...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: Todo error de dinero, apuestas o acceso es CRÍTICO (constitución, principios I y II).
      options:
        - CRÍTICO (dinero, apuestas, acceso o datos)
        - ALTO (funcionalidad rota)
        - MEDIO
        - BAJO (estilo o texto)
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec y requisito afectado
      placeholder: 'Spec 3, FR-012'
