name: Tarea de un spec
description: Una tarea o historia de usuario de tasks.md de un spec del equipo
title: '[Spec X] '
labels: ['spec']
body:
  - type: dropdown
    id: spec
    attributes:
      label: Spec
      options:
        - '1: fundaciones del stack'
        - '2: identidad, billetera y pagos'
        - '3: partidos, apuestas y liquidación'
        - '4: promociones, antifraude y reportes'
    validations:
      required: true
  - type: input
    id: tareas
    attributes:
      label: Tareas de tasks.md
      placeholder: 'T012–T018 (US2)'
    validations:
      required: true
  - type: textarea
    id: criterio
    attributes:
      label: Criterio de aceptación
      description: Copia el escenario Given/When/Then del spec que cierra esta tarea.
    validations:
      required: true
