# Servicios de desarrollo local. Las aplicaciones corren fuera de Docker con `pnpm dev`.
name: apuestasdeportivas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apuestas
      POSTGRES_PASSWORD: apuestas_local
      POSTGRES_DB: apuestas
      REPORTES_PASSWORD: ${REPORTES_PASSWORD:-reportes_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/usuario-solo-lectura.sql:/opt/sql/usuario-solo-lectura.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apuestas -d apuestas']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Spec 2: captura los correos de desarrollo y de las pruebas (verificación, recuperación).
  # SMTP en 1025; la bandeja y su API (/api/v1/messages) en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_WEB_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
